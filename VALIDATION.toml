# Finish-line validation contract. agent-hook and the agent-runtime-kit
# finish-line hooks block a turn that edited files until these commands pass.
# [path_classes] is the project-owned path classification read by nils-cli
# phase-aware test-first and docs-impact checks.

[[validation]]
context = "project-dev"
product = ["codex", "claude", "hermes", "dsh"]
commands = ["npm test", "npm run typecheck", "npm run benchmark:policy"]
description = "Run the complete routine repository gate once for the final candidate."

# Project-owned classification consumed by phase-aware test-first and
# finish-line checks. Unmatched paths stay fail-closed.
[path_classes]
production = ["VALIDATION.toml", ".github/workflows/compatibility.yml", ".github/workflows/agent-runtime-drift.yml", "package.json", "package-lock.json", "index.ts", "policy.ts", "tsconfig.json", "cordis.patch.yml", ".agents/**", "bin/**", "src/**", "scripts/**", "policy/**", "compatibility/**", "patches/**", "agent-docs/**", "agents/**", "skills/**"]
test = ["test/**"]
docs = ["AGENTS.md", "PROJECT_DEV_EDIT.md", "README.md", "DEVELOPMENT.md", "LICENSE", "docs/**"]
unmatched = "unknown"
