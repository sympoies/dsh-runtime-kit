- insert:
    - id: dsh-runtime-kit-invariants
      name: '@deepseek-ai/dsh-invariants'

    - id: dsh-runtime-kit
      name: '@sympoies/dsh-runtime-kit'
      config:
        agentHook: !!js process.env.DSH_RUNTIME_KIT_AGENT_HOOK_BIN ?? 'agent-hook'
        agentHookConfig: !!js process.env.DSH_RUNTIME_KIT_AGENT_HOOK_CONFIG
        agentHookPolicy: !!js process.env.DSH_RUNTIME_KIT_AGENT_HOOK_POLICY
        agentHookStateDir: !!js process.env.DSH_RUNTIME_KIT_AGENT_HOOK_STATE_DIR
        agentDocs: !!js process.env.DSH_RUNTIME_KIT_AGENT_DOCS_BIN ?? 'agent-docs'
        agentDocsHome: !!js process.env.DSH_RUNTIME_KIT_AGENT_DOCS_HOME
        agentDocsStateHome: !!js process.env.DSH_RUNTIME_KIT_AGENT_DOCS_STATE_HOME
        nilsCompatibilityCandidate: !!js process.env.DSH_RUNTIME_KIT_NILS_COMPATIBILITY_CANDIDATE
        protectedRoots: !!js JSON.parse(process.env.DSH_RUNTIME_KIT_PROTECTED_ROOTS ?? '[]')
        semanticCommit: !!js process.env.DSH_RUNTIME_KIT_SEMANTIC_COMMIT_BIN ?? 'semantic-commit'
        privateSkillsDir: !!js process.env.DSH_RUNTIME_KIT_PRIVATE_SKILLS_DIR
        mainAgentCli: !!js process.env.DSH_RUNTIME_KIT_MAIN_AGENT_BIN ?? 'main-agent'
        agentSessionCli: !!js process.env.DSH_RUNTIME_KIT_AGENT_SESSION_BIN ?? 'agent-session'
        contextMaxBytes: 20480
        contextTimeoutMs: 5000
        contextTeardownTimeoutMs: 2000
        maxActiveContextRequests: 2
        policyTimeoutMs: 5000
        policyTeardownTimeoutMs: 2000
        maxActivePolicyChecks: 4
        finishLineTimeoutMs: 5000
        finishLineTeardownTimeoutMs: 2000
        maxActiveFinishLineRequests: 4
        maxSameTurnFinishLineSteers: 2
        workspaceLeaseTimeoutMs: 5000
        workspaceLeaseTeardownTimeoutMs: 2000
        maxActiveWorkspaceLeaseRequests: 8
        workspaceRecoveryTimeoutMs: 5000
        workspaceRecoveryTeardownTimeoutMs: 2000
        maxActiveWorkspaceRecoveryRequests: 2
        governedCommitTimeoutMs: 30000
        governedCommitTeardownTimeoutMs: 2000
        maxActiveReviewers: 4
        maxQueuedReviewers: 16
        reviewerTaskMaxBytes: 32768
        reviewerOutputMaxBytes: 65536
        reviewerRedTeamContextMaxBytes: 131072
        reviewerTimeoutMs: 600000
        reviewerMaxDepth: 2
