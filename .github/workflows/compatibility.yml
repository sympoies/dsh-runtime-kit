name: DSH compatibility

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      # The committed provenance is what a consumer installs against: `npm pack`
      # runs no build, so a digest that no longer matches the packed sources makes
      # every install fail as `build-output-stale`. Every other job regenerates the
      # file instead of checking it, and each pull request stays self-consistent on
      # its own head, so the failure only appears once two source-touching branches
      # merge. This job runs on the merge result, which is where it can be caught.
      - name: Verify the committed build provenance matches the packed sources
        run: |
          npm run build:provenance
          git diff --exit-code -- compatibility/build-provenance.json \
            || { echo "::error::compatibility/build-provenance.json is stale; run npm run build:provenance and commit it"; exit 1; }
      - run: npm run benchmark:policy
      - name: Benchmark packed runtime with released agent-hook
        run: |
          archive="$RUNNER_TEMP/nils-cli-v1.28.8-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/sympoies/nils-cli/releases/download/v1.28.8/nils-cli-v1.28.8-x86_64-unknown-linux-gnu.tar.gz"
          echo "730f92f34e4e95ce94b06c17f3cbe74607d66209d252d9f61a62e9ae63a2c00b  $archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          AGENT_HOOK_BIN="$RUNNER_TEMP/nils-cli-v1.28.8-x86_64-unknown-linux-gnu/bin/agent-hook" \
            npm run benchmark:policy:real
      - name: Check packaged tier declarations against the released agent-hook
        env:
          AGENT_HOOK_BIN: ${{ runner.temp }}/nils-cli-v1.28.8-x86_64-unknown-linux-gnu/bin/agent-hook
        run: node --test test/policy-parity.test.ts
      - name: Validate repository agent-docs loading contract
        env:
          AGENT_DOCS_BIN: ${{ runner.temp }}/nils-cli-v1.28.8-x86_64-unknown-linux-gnu/bin/agent-docs
          AGENT_HOOK_BIN: ${{ runner.temp }}/nils-cli-v1.28.8-x86_64-unknown-linux-gnu/bin/agent-hook
        run: npm run test:agent-docs-catalog
      - name: Provision systemd user scope for released Git trust smoke
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          uid="$(id -u)"
          sudo loginctl enable-linger "${USER}"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
          test -S "/run/user/${uid}/systemd/private"
      - name: Prove released scope lock trusts contained system Git
        run: |
          probe="$RUNNER_TEMP/nils-cli-private-users-git"
          install -d -m 0700 "$probe"
          git -C "$probe" init --quiet
          systemd-run --user --wait --pipe --collect \
            --property=PrivateUsers=yes \
            --working-directory="$probe" \
            "$RUNNER_TEMP/nils-cli-v1.28.8-x86_64-unknown-linux-gnu/bin/agent-scope-lock" \
            create --path . --owner compatibility-private-users-git --format json
          test -f "$probe/.git/agent-scope-lock.json"

  upstream:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dsh_version: 0.1.1-rc.2
            revision: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
            public_contract: false
            node: 24
          - dsh_version: 0.1.2-alpha.4
            revision: 4e84901e6471b79ec0338099867ebb4606d12bb5
            public_contract: false
            node: 24
          - channel: pinned
            dsh_version: 0.1.2-rc.1
            revision: a66e4702047846cdaa10c66c9d3df3951f5ea70d
            public_contract: true
            node: 24
          - channel: upstream-next
            dsh_version: 0.1.2-rc.1
            revision: a66e4702047846cdaa10c66c9d3df3951f5ea70d
            public_contract: true
            node: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dsh-runtime-kit
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.revision }}
          path: deepseek-harness
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: deepseek-harness/pnpm-lock.yaml
      - name: Install runtime-kit dependencies and emit its build output
        working-directory: dsh-runtime-kit
        run: |
          npm ci --ignore-scripts --omit=peer
          npm run build:emit
          npm run build:provenance
      - name: Build selected pristine DSH
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run clean
          pnpm run build:lib:host
          pnpm dsh --help >/dev/null
          node "$GITHUB_WORKSPACE/dsh-runtime-kit/dist/scripts/digest-dsh-build-closure.js" \
            "$GITHUB_WORKSPACE/deepseek-harness" \
            > "$RUNNER_TEMP/pristine-dsh-build-closure.json"
      - name: Check selected pristine DSH contract
        if: matrix.public_contract
        working-directory: dsh-runtime-kit
        run: >-
          npm run --silent check:compatibility --
          --source-root "$GITHUB_WORKSPACE/deepseek-harness"
          --channel "${{ matrix.channel }}"
          --format json
      - name: Pack selected DSH public packages
        if: matrix.public_contract
        working-directory: dsh-runtime-kit
        run: |
          npm run --silent pack:compatibility-peers -- \
            --source-root "$GITHUB_WORKSPACE/deepseek-harness" \
            --artifact-root "$RUNNER_TEMP/dsh-compatibility-peers" \
            --channel "${{ matrix.channel }}" \
            --pnpm-bin "$(command -v pnpm)" \
            --receipt "$RUNNER_TEMP/dsh-peer-pack.json"
      - name: Stage authenticated selected DSH closure into the consumer
        if: matrix.public_contract
        working-directory: dsh-runtime-kit
        run: >-
          npm run --silent stage:compatibility-peers --
          --receipt "$RUNNER_TEMP/dsh-peer-pack.json"
          --artifact-root "$RUNNER_TEMP/dsh-compatibility-peers"
          --consumer-root "$GITHUB_WORKSPACE/dsh-runtime-kit"
      - name: Validate the consumer against selected DSH artifacts
        if: matrix.public_contract
        working-directory: dsh-runtime-kit
        run: npm run typecheck && npm test
      - name: Apply authenticated DSH execution-boundary patch
        working-directory: dsh-runtime-kit
        run: >-
          npm run --silent dsh-patch --
          --action apply
          --source-root "$GITHUB_WORKSPACE/deepseek-harness"
      - name: Validate patched DSH execution boundary
        working-directory: deepseek-harness
        run: |
          pnpm run typecheck
          pnpm vitest run \
            packages/core/tools/tests/tools.spec.ts \
            packages/llm/llm/tests/service.spec.ts \
            packages/subagent/subagent/tests/continuation.spec.ts \
            packages/subprocess/subprocess-local/tests/spawn.spec.ts
          pnpm run build:lib:host
      - name: Download authenticated nils-cli acceptance binaries
        run: |
          archive="$RUNNER_TEMP/nils-cli-v1.28.8-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/sympoies/nils-cli/releases/download/v1.28.8/nils-cli-v1.28.8-x86_64-unknown-linux-gnu.tar.gz"
          echo "730f92f34e4e95ce94b06c17f3cbe74607d66209d252d9f61a62e9ae63a2c00b  $archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
      - name: Provision native full-host acceptance services
        if: matrix.channel == 'pinned'
        run: |
          uid="$(id -u)"
          sudo loginctl enable-linger "${USER}"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
          test -S "/run/user/${uid}/systemd/private"
          systemctl --user show-environment >/dev/null
          command -v ip >/dev/null
          docker version --format '{{.Server.Version}}' >/dev/null
      - name: Run packed runtime smoke on the patched DSH boundary
        working-directory: dsh-runtime-kit
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/deepseek-harness
          AGENT_HOOK_BIN: ${{ runner.temp }}/nils-cli-v1.28.8-x86_64-unknown-linux-gnu/bin/agent-hook
          AGENT_DOCS_BIN: ${{ runner.temp }}/nils-cli-v1.28.8-x86_64-unknown-linux-gnu/bin/agent-docs
          DSH_RUNTIME_KIT_SMOKE_FULL_HOST: ${{ matrix.channel == 'pinned' && '1' || '0' }}
          DSH_RUNTIME_KIT_SMOKE_ACCEPTANCE: ${{ matrix.channel == 'pinned' && '1' || '0' }}
        run: npm run test:smoke
      - name: Run exact Agent Console TUI composition smoke
        if: matrix.channel == 'pinned'
        working-directory: dsh-runtime-kit
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/deepseek-harness
          DSH_RUNTIME_KIT_AGENT_CONSOLE_TUI_PACKAGE: '@deepseek-harness-tui/dsh-tui@0.10.1'
        run: |
          trusted_nils="$HOME/.dsh-runtime-kit-ci-nils"
          install -d -m 0700 "$trusted_nils"
          cp -a "$RUNNER_TEMP/nils-cli-v1.28.8-x86_64-unknown-linux-gnu/." "$trusted_nils/"
          chmod 0700 "$trusted_nils"
          AGENT_HOOK_BIN="$trusted_nils/bin/agent-hook" \
          AGENT_DOCS_BIN="$trusted_nils/bin/agent-docs" \
            npm run test:smoke
      - name: Reverse authenticated DSH patch
        if: always()
        working-directory: dsh-runtime-kit
        run: >-
          npm run --silent dsh-patch --
          --action reverse
          --source-root "$GITHUB_WORKSPACE/deepseek-harness"
      - name: Rebuild and authenticate unpatched DSH runtime
        if: always()
        working-directory: deepseek-harness
        run: |
          pnpm run clean
          pnpm run build:lib:host
          pnpm dsh --help >/dev/null
          node "$GITHUB_WORKSPACE/dsh-runtime-kit/dist/scripts/digest-dsh-build-closure.js" \
            "$GITHUB_WORKSPACE/deepseek-harness" \
            > "$RUNNER_TEMP/restored-dsh-build-closure.json"
          cmp "$RUNNER_TEMP/pristine-dsh-build-closure.json" \
            "$RUNNER_TEMP/restored-dsh-build-closure.json"
      - name: Run unpatched DSH tools smoke
        if: success()
        working-directory: dsh-runtime-kit
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/deepseek-harness
          AGENT_HOOK_BIN: ${{ runner.temp }}/nils-cli-v1.28.8-x86_64-unknown-linux-gnu/bin/agent-hook
        run: |
          package_name="$(npm pack --silent --ignore-scripts --pack-destination "$RUNNER_TEMP")"
          package="$RUNNER_TEMP/$package_name"
          package_sha="$(sha256sum "$package" | cut -d ' ' -f 1)"
          DSH_ACCEPTANCE_CANDIDATE_PACKAGE_TARBALL="$package" \
          DSH_ACCEPTANCE_BASELINE_PACKAGE_TARBALL="$package" \
          DSH_ACCEPTANCE_CANDIDATE_PACKAGE_SHA256="$package_sha" \
          DSH_ACCEPTANCE_BASELINE_PACKAGE_SHA256="$package_sha" \
          DSH_ACCEPTANCE_BASELINE_NILS_BIN_DIR="$RUNNER_TEMP/nils-cli-v1.28.8-x86_64-unknown-linux-gnu/bin" \
          DSH_ACCEPTANCE_CANDIDATE_NILS_SOURCE_COMMIT=eb37193cdef886f1a98ca426dae3250c65c93c72 \
          DSH_ACCEPTANCE_BASELINE_NILS_SOURCE_COMMIT=eb37193cdef886f1a98ca426dae3250c65c93c72 \
          DSH_ACCEPTANCE_CANDIDATE_NILS_ARTIFACTS='{"agent-hook":"bed2fdd99e6a985105e57c34bf9963d36b49a6c9943430e90ec1d6be684f2639","agent-docs":"87418851944bc8fd8b7c5078784329edd6ec731cc0316542643829f7bda94acd"}' \
          DSH_ACCEPTANCE_BASELINE_NILS_ARTIFACTS='{"agent-hook":"bed2fdd99e6a985105e57c34bf9963d36b49a6c9943430e90ec1d6be684f2639","agent-docs":"87418851944bc8fd8b7c5078784329edd6ec731cc0316542643829f7bda94acd"}' \
          DSH_ACCEPTANCE_DSH_VERSION="${{ matrix.dsh_version }}" \
          DSH_ACCEPTANCE_DSH_REVISION="${{ matrix.revision }}" \
          PNPM_BIN="$(command -v pnpm)" \
          NPM_BIN="$(command -v npm)" \
          DSH_ACCEPTANCE_UNPATCHED_ONLY=1 \
          npm run test:authoritative-acceptance-smoke
      - name: Assert upstream checkout returned to pristine state
        if: always()
        working-directory: deepseek-harness
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

  macos-runtime-health:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dsh-runtime-kit
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: a66e4702047846cdaa10c66c9d3df3951f5ea70d
          path: deepseek-harness
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: deepseek-harness/pnpm-lock.yaml
      - name: Install runtime-kit dependencies and emit its build output
        working-directory: dsh-runtime-kit
        run: |
          npm ci --ignore-scripts --omit=peer
          npm run build:emit
          npm run build:provenance
      - name: Build pristine DSH on macOS
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run clean
          pnpm run build:lib:host
          node "$GITHUB_WORKSPACE/dsh-runtime-kit/dist/scripts/digest-dsh-build-closure.js" \
            "$GITHUB_WORKSPACE/deepseek-harness" \
            > "$RUNNER_TEMP/pristine-dsh-build-closure.json"
      - name: Link the vendored DSH cordis into the consumer
        working-directory: dsh-runtime-kit
        run: |
          mkdir -p node_modules/@deepseek-ai
          ln -s "$GITHUB_WORKSPACE/deepseek-harness/vendor/cordis" \
            node_modules/@deepseek-ai/cordis
      - name: Apply authenticated DSH execution-boundary patch
        working-directory: dsh-runtime-kit
        run: >-
          npm run --silent dsh-patch --
          --action apply
          --source-root "$GITHUB_WORKSPACE/deepseek-harness"
      - name: Validate Darwin descriptor binding and patched DSH boundary
        run: |
          cd dsh-runtime-kit
          node --test test/runtime-health-provider.test.ts
          cd ../deepseek-harness
          pnpm vitest run \
            packages/core/tools/tests/tools.spec.ts \
            packages/llm/llm/tests/service.spec.ts \
            packages/subagent/subagent/tests/continuation.spec.ts \
            packages/subprocess/subprocess-local/tests/spawn.spec.ts
          pnpm run build:lib:host
      - name: Download authenticated macOS nils-cli acceptance binaries
        run: |
          archive="$RUNNER_TEMP/nils-cli-v1.28.8-aarch64-apple-darwin.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/sympoies/nils-cli/releases/download/v1.28.8/nils-cli-v1.28.8-aarch64-apple-darwin.tar.gz"
          echo "2233fb785a59a7e8d15d9c4be1b4e8dd8c40a7ec69177d7d707c5052bf6bd763  $archive" \
            | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
      - name: Run packed runtime-health smoke on macOS
        working-directory: dsh-runtime-kit
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/deepseek-harness
          AGENT_HOOK_BIN: ${{ runner.temp }}/nils-cli-v1.28.8-aarch64-apple-darwin/bin/agent-hook
          AGENT_DOCS_BIN: ${{ runner.temp }}/nils-cli-v1.28.8-aarch64-apple-darwin/bin/agent-docs
          DSH_RUNTIME_KIT_SMOKE_HEALTH_ONLY: '1'
        run: npm run test:smoke
      - name: Reverse authenticated DSH patch
        if: always()
        working-directory: dsh-runtime-kit
        run: >-
          npm run --silent dsh-patch --
          --action reverse
          --source-root "$GITHUB_WORKSPACE/deepseek-harness"
      - name: Rebuild and authenticate unpatched DSH runtime
        if: always()
        working-directory: deepseek-harness
        run: |
          pnpm run clean
          pnpm run build:lib:host
          pnpm dsh --help >/dev/null
          node "$GITHUB_WORKSPACE/dsh-runtime-kit/dist/scripts/digest-dsh-build-closure.js" \
            "$GITHUB_WORKSPACE/deepseek-harness" \
            > "$RUNNER_TEMP/restored-dsh-build-closure.json"
          cmp "$RUNNER_TEMP/pristine-dsh-build-closure.json" \
            "$RUNNER_TEMP/restored-dsh-build-closure.json"
      - name: Run unpatched DSH tools smoke
        if: success()
        working-directory: dsh-runtime-kit
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/deepseek-harness
          AGENT_HOOK_BIN: ${{ runner.temp }}/nils-cli-v1.28.8-aarch64-apple-darwin/bin/agent-hook
        run: |
          package_name="$(npm pack --silent --ignore-scripts --pack-destination "$RUNNER_TEMP")"
          package="$RUNNER_TEMP/$package_name"
          package_sha="$(shasum -a 256 "$package" | cut -d ' ' -f 1)"
          DSH_ACCEPTANCE_CANDIDATE_PACKAGE_TARBALL="$package" \
          DSH_ACCEPTANCE_BASELINE_PACKAGE_TARBALL="$package" \
          DSH_ACCEPTANCE_CANDIDATE_PACKAGE_SHA256="$package_sha" \
          DSH_ACCEPTANCE_BASELINE_PACKAGE_SHA256="$package_sha" \
          DSH_ACCEPTANCE_BASELINE_NILS_BIN_DIR="$RUNNER_TEMP/nils-cli-v1.28.8-aarch64-apple-darwin/bin" \
          DSH_ACCEPTANCE_CANDIDATE_NILS_SOURCE_COMMIT=eb37193cdef886f1a98ca426dae3250c65c93c72 \
          DSH_ACCEPTANCE_BASELINE_NILS_SOURCE_COMMIT=eb37193cdef886f1a98ca426dae3250c65c93c72 \
          DSH_ACCEPTANCE_CANDIDATE_NILS_ARTIFACTS='{"agent-hook":"de6a5377ad3708b5a60aa1e350b60ae6d533a9b0a29c96762b0e6ee24f1c41b5","agent-docs":"d302aa6283d2827760e4464cc9f8ae56e986069c3b5ef7b2dbb2833ec7624762"}' \
          DSH_ACCEPTANCE_BASELINE_NILS_ARTIFACTS='{"agent-hook":"de6a5377ad3708b5a60aa1e350b60ae6d533a9b0a29c96762b0e6ee24f1c41b5","agent-docs":"d302aa6283d2827760e4464cc9f8ae56e986069c3b5ef7b2dbb2833ec7624762"}' \
          DSH_ACCEPTANCE_DSH_VERSION=0.1.2-rc.1 \
          DSH_ACCEPTANCE_DSH_REVISION=a66e4702047846cdaa10c66c9d3df3951f5ea70d \
          PNPM_BIN="$(command -v pnpm)" \
          NPM_BIN="$(command -v npm)" \
          DSH_ACCEPTANCE_UNPATCHED_ONLY=1 \
          npm run test:authoritative-acceptance-smoke
      - name: Assert macOS DSH checkout returned to pristine state
        if: always()
        working-directory: deepseek-harness
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
