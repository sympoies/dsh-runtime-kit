name: DSH compatibility

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run benchmark:policy
      - name: Benchmark packed runtime with released agent-hook
        run: |
          archive="$RUNNER_TEMP/nils-cli-v1.27.32-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/sympoies/nils-cli/releases/download/v1.27.32/nils-cli-v1.27.32-x86_64-unknown-linux-gnu.tar.gz"
          echo "db0ef6c888574c0c4e538e96a9a1dfa8f7d23d9beceed7249b90b54061b8918c  $archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          AGENT_HOOK_BIN="$RUNNER_TEMP/nils-cli-v1.27.32-x86_64-unknown-linux-gnu/bin/agent-hook" \
            npm run benchmark:policy:real
      - name: Validate repository agent-docs loading contract
        env:
          AGENT_DOCS_BIN: ${{ runner.temp }}/nils-cli-v1.27.32-x86_64-unknown-linux-gnu/bin/agent-docs
          AGENT_HOOK_BIN: ${{ runner.temp }}/nils-cli-v1.27.32-x86_64-unknown-linux-gnu/bin/agent-hook
        run: npm run test:agent-docs-catalog
      - name: Provision systemd user scope for released Git trust smoke
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          uid="$(id -u)"
          sudo loginctl enable-linger "${USER}"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
          test -S "/run/user/${uid}/systemd/private"
      - name: Prove released scope lock trusts contained system Git
        run: |
          probe="$RUNNER_TEMP/nils-cli-private-users-git"
          install -d -m 0700 "$probe"
          git -C "$probe" init --quiet
          systemd-run --user --wait --pipe --collect \
            --property=PrivateUsers=yes \
            --working-directory="$probe" \
            "$RUNNER_TEMP/nils-cli-v1.27.32-x86_64-unknown-linux-gnu/bin/agent-scope-lock" \
            create --path . --owner compatibility-private-users-git --format json
          test -f "$probe/.git/agent-scope-lock.json"

  upstream:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dsh_version: 0.1.0-rc.7
            revision: 99f6f02fecdb7dff40c3fbc9470f5907c29f74ca
            public_contract: false
            node: 24
          - dsh_version: 0.1.0-rc.8
            revision: 141eb6fef83422698aef7a981029e843e8161534
            public_contract: false
            node: 24
          - channel: pinned
            dsh_version: 0.1.1-rc.2
            revision: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
            public_contract: true
            node: 24
          - channel: upstream-next
            dsh_version: 0.1.1-rc.2
            revision: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
            public_contract: true
            node: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dsh-runtime-kit
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.revision }}
          path: deepseek-harness
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: deepseek-harness/pnpm-lock.yaml
      - name: Build selected pristine DSH
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run clean
          pnpm run build:lib:host
          pnpm dsh --help >/dev/null
          node "$GITHUB_WORKSPACE/dsh-runtime-kit/scripts/digest-dsh-build-closure.mjs" \
            "$GITHUB_WORKSPACE/deepseek-harness" \
            > "$RUNNER_TEMP/pristine-dsh-build-closure.json"
      - name: Install runtime-kit dependencies
        working-directory: dsh-runtime-kit
        run: npm ci --ignore-scripts --omit=peer
      - name: Check selected pristine DSH contract
        if: matrix.public_contract
        working-directory: dsh-runtime-kit
        run: >-
          npm run --silent check:compatibility --
          --source-root "$GITHUB_WORKSPACE/deepseek-harness"
          --channel "${{ matrix.channel }}"
          --format json
      - name: Pack selected DSH public packages
        if: matrix.public_contract
        working-directory: dsh-runtime-kit
        run: |
          npm run --silent pack:compatibility-peers -- \
            --source-root "$GITHUB_WORKSPACE/deepseek-harness" \
            --artifact-root "$RUNNER_TEMP/dsh-compatibility-peers" \
            --channel "${{ matrix.channel }}" \
            --pnpm-bin "$(command -v pnpm)" \
            --receipt "$RUNNER_TEMP/dsh-peer-pack.json"
      - name: Stage authenticated selected DSH closure into the consumer
        if: matrix.public_contract
        working-directory: dsh-runtime-kit
        run: >-
          npm run --silent stage:compatibility-peers --
          --receipt "$RUNNER_TEMP/dsh-peer-pack.json"
          --artifact-root "$RUNNER_TEMP/dsh-compatibility-peers"
          --consumer-root "$GITHUB_WORKSPACE/dsh-runtime-kit"
      - name: Validate the consumer against selected DSH artifacts
        if: matrix.public_contract
        working-directory: dsh-runtime-kit
        run: npm run typecheck && npm test
      - name: Apply authenticated DSH execution-boundary patch
        working-directory: dsh-runtime-kit
        run: >-
          npm run --silent dsh-patch --
          --action apply
          --source-root "$GITHUB_WORKSPACE/deepseek-harness"
      - name: Validate patched DSH execution boundary
        working-directory: deepseek-harness
        run: |
          pnpm run typecheck
          pnpm vitest run \
            packages/core/tools/tests/tools.spec.ts \
            packages/llm/llm/tests/service.spec.ts \
            packages/subagent/subagent/tests/continuation.spec.ts \
            packages/subprocess/subprocess-local/tests/spawn.spec.ts
          pnpm run build:lib:host
      - name: Download authenticated nils-cli acceptance binaries
        run: |
          archive="$RUNNER_TEMP/nils-cli-v1.27.32-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/sympoies/nils-cli/releases/download/v1.27.32/nils-cli-v1.27.32-x86_64-unknown-linux-gnu.tar.gz"
          echo "db0ef6c888574c0c4e538e96a9a1dfa8f7d23d9beceed7249b90b54061b8918c  $archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          rollback_archive="$RUNNER_TEMP/nils-cli-v1.27.29-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$rollback_archive" \
            "https://github.com/sympoies/nils-cli/releases/download/v1.27.29/nils-cli-v1.27.29-x86_64-unknown-linux-gnu.tar.gz"
          echo "4a169d28032ace8e6d696c9385e3096dbea6e5e1ea17c492b9b0f4094f8b5f21  $rollback_archive" \
            | sha256sum --check --strict
          tar -xzf "$rollback_archive" -C "$RUNNER_TEMP"
      - name: Provision native full-host acceptance services
        if: matrix.channel == 'pinned'
        run: |
          uid="$(id -u)"
          sudo loginctl enable-linger "${USER}"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
          test -S "/run/user/${uid}/systemd/private"
          systemctl --user show-environment >/dev/null
          command -v ip >/dev/null
          docker version --format '{{.Server.Version}}' >/dev/null
      - name: Run packed runtime smoke on the patched DSH boundary
        working-directory: dsh-runtime-kit
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/deepseek-harness
          AGENT_HOOK_BIN: ${{ runner.temp }}/nils-cli-v1.27.32-x86_64-unknown-linux-gnu/bin/agent-hook
          AGENT_DOCS_BIN: ${{ runner.temp }}/nils-cli-v1.27.32-x86_64-unknown-linux-gnu/bin/agent-docs
          DSH_RUNTIME_KIT_SMOKE_FULL_HOST: ${{ matrix.channel == 'pinned' && '1' || '0' }}
          DSH_RUNTIME_KIT_SMOKE_ACCEPTANCE: ${{ matrix.channel == 'pinned' && '1' || '0' }}
        run: npm run test:smoke
      - name: Run exact Agent Console TUI composition smoke
        if: matrix.channel == 'pinned'
        working-directory: dsh-runtime-kit
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/deepseek-harness
          AGENT_HOOK_BIN: ${{ runner.temp }}/nils-cli-v1.27.32-x86_64-unknown-linux-gnu/bin/agent-hook
          AGENT_DOCS_BIN: ${{ runner.temp }}/nils-cli-v1.27.32-x86_64-unknown-linux-gnu/bin/agent-docs
          DSH_RUNTIME_KIT_AGENT_CONSOLE_TUI_PACKAGE: '@deepseek-harness-tui/dsh-tui@0.10.0-beta.4'
        run: npm run test:smoke
      - name: Reverse authenticated DSH patch
        if: always()
        working-directory: dsh-runtime-kit
        run: >-
          npm run --silent dsh-patch --
          --action reverse
          --source-root "$GITHUB_WORKSPACE/deepseek-harness"
      - name: Rebuild and authenticate unpatched DSH runtime
        if: always()
        working-directory: deepseek-harness
        run: |
          pnpm run clean
          pnpm run build:lib:host
          pnpm dsh --help >/dev/null
          node "$GITHUB_WORKSPACE/dsh-runtime-kit/scripts/digest-dsh-build-closure.mjs" \
            "$GITHUB_WORKSPACE/deepseek-harness" \
            > "$RUNNER_TEMP/restored-dsh-build-closure.json"
          cmp "$RUNNER_TEMP/pristine-dsh-build-closure.json" \
            "$RUNNER_TEMP/restored-dsh-build-closure.json"
      - name: Run unpatched DSH tools smoke
        if: success()
        working-directory: dsh-runtime-kit
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/deepseek-harness
          AGENT_HOOK_BIN: ${{ runner.temp }}/nils-cli-v1.27.32-x86_64-unknown-linux-gnu/bin/agent-hook
        run: |
          package_name="$(npm pack --silent --ignore-scripts --pack-destination "$RUNNER_TEMP")"
          package="$RUNNER_TEMP/$package_name"
          package_sha="$(sha256sum "$package" | cut -d ' ' -f 1)"
          DSH_ACCEPTANCE_CANDIDATE_PACKAGE_TARBALL="$package" \
          DSH_ACCEPTANCE_BASELINE_PACKAGE_TARBALL="$package" \
          DSH_ACCEPTANCE_CANDIDATE_PACKAGE_SHA256="$package_sha" \
          DSH_ACCEPTANCE_BASELINE_PACKAGE_SHA256="$package_sha" \
          DSH_ACCEPTANCE_BASELINE_NILS_BIN_DIR="$RUNNER_TEMP/nils-cli-v1.27.29-x86_64-unknown-linux-gnu/bin" \
          DSH_ACCEPTANCE_CANDIDATE_NILS_SOURCE_COMMIT=96ee66590428e173c10c494565a3bb429b7b6db8 \
          DSH_ACCEPTANCE_BASELINE_NILS_SOURCE_COMMIT=e6f50a34d68e7a6638eb104e423dcacd116c4071 \
          DSH_ACCEPTANCE_CANDIDATE_NILS_ARTIFACTS='{"agent-hook":"e51fc4258c8c245707aa68ac7c37b58a49670bd2d62b5d6663c2f7db62ae6dae","agent-docs":"c709f83826d0fc7b19d5c3b6f52d6a16007fbb815e20f0b1721102c89d710539"}' \
          DSH_ACCEPTANCE_BASELINE_NILS_ARTIFACTS='{"agent-hook":"75ac5435d3afb6dc129cf6179f71d3289004ef335942674a9bbce58cd0ad8cd0","agent-docs":"095f0a33e73727be984e8601871034353e70bea7229e95f304b6e37195e96c71"}' \
          DSH_ACCEPTANCE_DSH_VERSION="${{ matrix.dsh_version }}" \
          DSH_ACCEPTANCE_DSH_REVISION="${{ matrix.revision }}" \
          PNPM_BIN="$(command -v pnpm)" \
          NPM_BIN="$(command -v npm)" \
          DSH_ACCEPTANCE_UNPATCHED_ONLY=1 \
          npm run test:authoritative-acceptance-smoke
      - name: Assert upstream checkout returned to pristine state
        if: always()
        working-directory: deepseek-harness
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

  macos-runtime-health:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dsh-runtime-kit
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
          path: deepseek-harness
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: deepseek-harness/pnpm-lock.yaml
      - name: Build pristine DSH on macOS
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run clean
          pnpm run build:lib:host
          node "$GITHUB_WORKSPACE/dsh-runtime-kit/scripts/digest-dsh-build-closure.mjs" \
            "$GITHUB_WORKSPACE/deepseek-harness" \
            > "$RUNNER_TEMP/pristine-dsh-build-closure.json"
      - name: Install runtime-kit dependencies
        working-directory: dsh-runtime-kit
        run: |
          npm ci --ignore-scripts --omit=peer
          mkdir -p node_modules/@deepseek-ai
          ln -s "$GITHUB_WORKSPACE/deepseek-harness/vendor/cordis" \
            node_modules/@deepseek-ai/cordis
      - name: Apply authenticated DSH execution-boundary patch
        working-directory: dsh-runtime-kit
        run: >-
          npm run --silent dsh-patch --
          --action apply
          --source-root "$GITHUB_WORKSPACE/deepseek-harness"
      - name: Validate Darwin descriptor binding and patched DSH boundary
        run: |
          cd dsh-runtime-kit
          node --test test/runtime-health-provider.test.mjs
          cd ../deepseek-harness
          pnpm vitest run \
            packages/core/tools/tests/tools.spec.ts \
            packages/llm/llm/tests/service.spec.ts \
            packages/subagent/subagent/tests/continuation.spec.ts \
            packages/subprocess/subprocess-local/tests/spawn.spec.ts
          pnpm run build:lib:host
      - name: Download authenticated macOS nils-cli acceptance binaries
        run: |
          archive="$RUNNER_TEMP/nils-cli-v1.27.32-aarch64-apple-darwin.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/sympoies/nils-cli/releases/download/v1.27.32/nils-cli-v1.27.32-aarch64-apple-darwin.tar.gz"
          echo "69c1c5e9195c59fdadaa9069a0d6a3908462cef52c79b0934bdf664e0353fc2c  $archive" \
            | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          rollback_archive="$RUNNER_TEMP/nils-cli-v1.27.29-aarch64-apple-darwin.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$rollback_archive" \
            "https://github.com/sympoies/nils-cli/releases/download/v1.27.29/nils-cli-v1.27.29-aarch64-apple-darwin.tar.gz"
          echo "5d65f5f7982910d7aa69466e054b9a05cf4453d6ce7aa26df47ad1643bdff5cf  $rollback_archive" \
            | shasum -a 256 --check
          tar -xzf "$rollback_archive" -C "$RUNNER_TEMP"
      - name: Run packed runtime-health smoke on macOS
        working-directory: dsh-runtime-kit
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/deepseek-harness
          AGENT_HOOK_BIN: ${{ runner.temp }}/nils-cli-v1.27.32-aarch64-apple-darwin/bin/agent-hook
          AGENT_DOCS_BIN: ${{ runner.temp }}/nils-cli-v1.27.32-aarch64-apple-darwin/bin/agent-docs
          DSH_RUNTIME_KIT_SMOKE_HEALTH_ONLY: '1'
        run: npm run test:smoke
      - name: Reverse authenticated DSH patch
        if: always()
        working-directory: dsh-runtime-kit
        run: >-
          npm run --silent dsh-patch --
          --action reverse
          --source-root "$GITHUB_WORKSPACE/deepseek-harness"
      - name: Rebuild and authenticate unpatched DSH runtime
        if: always()
        working-directory: deepseek-harness
        run: |
          pnpm run clean
          pnpm run build:lib:host
          pnpm dsh --help >/dev/null
          node "$GITHUB_WORKSPACE/dsh-runtime-kit/scripts/digest-dsh-build-closure.mjs" \
            "$GITHUB_WORKSPACE/deepseek-harness" \
            > "$RUNNER_TEMP/restored-dsh-build-closure.json"
          cmp "$RUNNER_TEMP/pristine-dsh-build-closure.json" \
            "$RUNNER_TEMP/restored-dsh-build-closure.json"
      - name: Run unpatched DSH tools smoke
        if: success()
        working-directory: dsh-runtime-kit
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/deepseek-harness
          AGENT_HOOK_BIN: ${{ runner.temp }}/nils-cli-v1.27.32-aarch64-apple-darwin/bin/agent-hook
        run: |
          package_name="$(npm pack --silent --ignore-scripts --pack-destination "$RUNNER_TEMP")"
          package="$RUNNER_TEMP/$package_name"
          package_sha="$(shasum -a 256 "$package" | cut -d ' ' -f 1)"
          DSH_ACCEPTANCE_CANDIDATE_PACKAGE_TARBALL="$package" \
          DSH_ACCEPTANCE_BASELINE_PACKAGE_TARBALL="$package" \
          DSH_ACCEPTANCE_CANDIDATE_PACKAGE_SHA256="$package_sha" \
          DSH_ACCEPTANCE_BASELINE_PACKAGE_SHA256="$package_sha" \
          DSH_ACCEPTANCE_BASELINE_NILS_BIN_DIR="$RUNNER_TEMP/nils-cli-v1.27.29-aarch64-apple-darwin/bin" \
          DSH_ACCEPTANCE_CANDIDATE_NILS_SOURCE_COMMIT=96ee66590428e173c10c494565a3bb429b7b6db8 \
          DSH_ACCEPTANCE_BASELINE_NILS_SOURCE_COMMIT=e6f50a34d68e7a6638eb104e423dcacd116c4071 \
          DSH_ACCEPTANCE_CANDIDATE_NILS_ARTIFACTS='{"agent-hook":"6d231fe3c066f3e112525a819551770bc14ad1acbf9846e982f6f852cea6b7c7","agent-docs":"a97ae2e7067b653e347db19d0e0bbe8afd2d168fd1d3e6fd4e67c437639c69e0"}' \
          DSH_ACCEPTANCE_BASELINE_NILS_ARTIFACTS='{"agent-hook":"6cf18e4e86563704284835d4c04437f7d74aadf8caa2ce0f2b0f81d1a84d2195","agent-docs":"1ea127194cee10b382ac016da15ac6a9dcc5d08b1a8c57819adadb288af7e230"}' \
          DSH_ACCEPTANCE_DSH_VERSION=0.1.1-rc.2 \
          DSH_ACCEPTANCE_DSH_REVISION=b150a551b8d465e31e418e1b2eaf5e79bbb7d28e \
          PNPM_BIN="$(command -v pnpm)" \
          NPM_BIN="$(command -v npm)" \
          DSH_ACCEPTANCE_UNPATCHED_ONLY=1 \
          npm run test:authoritative-acceptance-smoke
      - name: Assert macOS DSH checkout returned to pristine state
        if: always()
        working-directory: deepseek-harness
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
