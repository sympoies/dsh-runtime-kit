name: DSH compatibility

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      # The committed provenance is what a consumer installs against: `npm pack`
      # runs no build, so a digest that no longer matches the packed sources makes
      # every install fail as `build-output-stale`. Every other job regenerates the
      # file instead of checking it, and each pull request stays self-consistent on
      # its own head, so the failure only appears once two source-touching branches
      # merge. This job runs on the merge result, which is where it can be caught.
      - name: Verify the committed build provenance matches the packed sources
        run: |
          npm run build:provenance
          git diff --exit-code -- compatibility/build-provenance.json \
            || { echo "::error::compatibility/build-provenance.json is stale; run npm run build:provenance and commit it"; exit 1; }
      - run: npm run benchmark:policy
      - name: Benchmark packed runtime with released agent-hook
        run: |
          archive="$RUNNER_TEMP/nils-cli-v1.28.43-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/sympoies/nils-cli/releases/download/v1.28.43/nils-cli-v1.28.43-x86_64-unknown-linux-gnu.tar.gz"
          echo "a40789fa4d0ebfde240557ca2032289c1b961aae4ebbbcf44291531c4cac15ce  $archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          AGENT_HOOK_BIN="$RUNNER_TEMP/nils-cli-v1.28.43-x86_64-unknown-linux-gnu/bin/agent-hook" \
            npm run benchmark:policy:real
      - name: Check packaged tier declarations against the released agent-hook
        env:
          AGENT_HOOK_BIN: ${{ runner.temp }}/nils-cli-v1.28.43-x86_64-unknown-linux-gnu/bin/agent-hook
        run: node --test test/policy-parity.test.ts
      - name: Validate repository agent-docs loading contract
        env:
          AGENT_DOCS_BIN: ${{ runner.temp }}/nils-cli-v1.28.43-x86_64-unknown-linux-gnu/bin/agent-docs
          AGENT_HOOK_BIN: ${{ runner.temp }}/nils-cli-v1.28.43-x86_64-unknown-linux-gnu/bin/agent-hook
        run: npm run test:agent-docs-catalog
      - name: Provision systemd user scope for released Git trust smoke
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          uid="$(id -u)"
          sudo loginctl enable-linger "${USER}"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
          test -S "/run/user/${uid}/systemd/private"
      - name: Prove released scope lock trusts contained system Git
        run: |
          probe="$RUNNER_TEMP/nils-cli-private-users-git"
          install -d -m 0700 "$probe"
          git -C "$probe" init --quiet
          systemd-run --user --wait --pipe --collect \
            --property=PrivateUsers=yes \
            --working-directory="$probe" \
            "$RUNNER_TEMP/nils-cli-v1.28.43-x86_64-unknown-linux-gnu/bin/agent-scope-lock" \
            create --path . --owner compatibility-private-users-git --format json
          test -f "$probe/.git/agent-scope-lock.json"

  upstream:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dsh_version: 0.1.5-alpha.2
            revision: b2e3b2a0125854567a4a5fcba75782e42fe84901
            public_contract: false
            node: 24
          - channel: pinned
            dsh_version: 0.1.6-alpha.2
            revision: ddefc45fbc7f8e46dd73185e68295696d1297887
            public_contract: true
            node: 24
          - channel: upstream-next
            dsh_version: 0.1.6-alpha.2
            revision: ddefc45fbc7f8e46dd73185e68295696d1297887
            public_contract: true
            node: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dsh-runtime-kit
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.revision }}
          path: deepseek-harness
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: deepseek-harness/pnpm-lock.yaml
      - name: Install runtime-kit dependencies and emit its build output
        working-directory: dsh-runtime-kit
        run: |
          npm ci --ignore-scripts --omit=peer
          npm run build:emit
          npm run build:provenance
      - name: Build selected pristine DSH
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run clean
          pnpm run build:native-system
          pnpm run build:lib:host
          pnpm dsh --help >/dev/null
          node "$GITHUB_WORKSPACE/dsh-runtime-kit/dist/scripts/digest-dsh-build-closure.js" \
            "$GITHUB_WORKSPACE/deepseek-harness" \
            > "$RUNNER_TEMP/pristine-dsh-build-closure.json"
      - name: Check selected pristine DSH contract
        if: matrix.public_contract
        working-directory: dsh-runtime-kit
        run: >-
          npm run --silent check:compatibility --
          --source-root "$GITHUB_WORKSPACE/deepseek-harness"
          --channel "${{ matrix.channel }}"
          --format json
      - name: Pack selected DSH public packages
        if: matrix.public_contract
        working-directory: dsh-runtime-kit
        run: |
          npm run --silent pack:compatibility-peers -- \
            --source-root "$GITHUB_WORKSPACE/deepseek-harness" \
            --artifact-root "$RUNNER_TEMP/dsh-compatibility-peers" \
            --channel "${{ matrix.channel }}" \
            --pnpm-bin "$(command -v pnpm)" \
            --receipt "$RUNNER_TEMP/dsh-peer-pack.json"
      - name: Stage authenticated selected DSH closure into the consumer
        if: matrix.public_contract
        working-directory: dsh-runtime-kit
        run: >-
          npm run --silent stage:compatibility-peers --
          --receipt "$RUNNER_TEMP/dsh-peer-pack.json"
          --artifact-root "$RUNNER_TEMP/dsh-compatibility-peers"
          --consumer-root "$GITHUB_WORKSPACE/dsh-runtime-kit"
      - name: Validate the consumer against selected DSH artifacts
        if: matrix.public_contract
        working-directory: dsh-runtime-kit
        run: npm run typecheck && npm test
      - name: Apply authenticated DSH execution-boundary patch
        working-directory: dsh-runtime-kit
        run: >-
          npm run --silent dsh-patch --
          --action apply
          --source-root "$GITHUB_WORKSPACE/deepseek-harness"
      - name: Build selected DSH native test prerequisite
        working-directory: deepseek-harness
        run: pnpm run build:native-system
      - name: Validate retained DSH 0.1.5 execution boundary
        if: matrix.dsh_version == '0.1.5-alpha.2'
        working-directory: deepseek-harness
        run: |
          pnpm run typecheck
          pnpm vitest run \
            packages/core/tools/tests/tools.spec.ts \
            packages/llm/llm/tests/service.spec.ts \
            packages/subagent/subagent/tests/continuation.spec.ts \
            packages/subprocess/subprocess-local/tests/spawn.spec.ts
          pnpm run build:lib:host
      - name: Validate patched DSH execution boundary
        if: matrix.dsh_version == '0.1.6-alpha.2'
        working-directory: deepseek-harness
        run: |
          pnpm run typecheck
          pnpm vitest run \
            packages/boot/app-boot/tests/app-boot.spec.ts \
            packages/core/tools/tests/tools.spec.ts \
            packages/fs/fs-sandbox/tests/fs-sandbox.spec.ts \
            packages/fs/tool-fs/tests/tools.spec.ts \
            packages/goal/goal/tests/goal.spec.ts \
            packages/llm/llm/tests/service.spec.ts \
            packages/sandbox/sandbox-local/tests/local.spec.ts \
            packages/sandbox/sandbox-policy/tests/policy.spec.ts \
            packages/sandbox/sandbox/tests/escalation.spec.ts \
            packages/shell/tool-bash/tests/tools.spec.ts \
            packages/subagent/subagent/tests/continuation.spec.ts \
            packages/subprocess/subprocess-local/tests/spawn.spec.ts
          pnpm run build:lib:host
      - name: Download authenticated nils-cli acceptance binaries
        run: |
          archive="$RUNNER_TEMP/nils-cli-v1.28.43-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/sympoies/nils-cli/releases/download/v1.28.43/nils-cli-v1.28.43-x86_64-unknown-linux-gnu.tar.gz"
          echo "a40789fa4d0ebfde240557ca2032289c1b961aae4ebbbcf44291531c4cac15ce  $archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
      - name: Provision native full-host acceptance services
        if: matrix.channel == 'pinned'
        run: |
          uid="$(id -u)"
          sudo loginctl enable-linger "${USER}"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
          test -S "/run/user/${uid}/systemd/private"
          systemctl --user show-environment >/dev/null
          command -v ip >/dev/null
          docker version --format '{{.Server.Version}}' >/dev/null
      - name: Run packed runtime smoke on the patched DSH boundary
        working-directory: dsh-runtime-kit
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/deepseek-harness
          AGENT_HOOK_BIN: ${{ runner.temp }}/nils-cli-v1.28.43-x86_64-unknown-linux-gnu/bin/agent-hook
          AGENT_DOCS_BIN: ${{ runner.temp }}/nils-cli-v1.28.43-x86_64-unknown-linux-gnu/bin/agent-docs
          DSH_RUNTIME_KIT_SMOKE_FULL_HOST: ${{ matrix.channel == 'pinned' && '1' || '0' }}
          DSH_RUNTIME_KIT_SMOKE_ACCEPTANCE: ${{ matrix.channel == 'pinned' && '1' || '0' }}
        run: npm run test:smoke
      - name: Reverse authenticated DSH patch
        if: always()
        working-directory: dsh-runtime-kit
        run: >-
          npm run --silent dsh-patch --
          --action reverse
          --source-root "$GITHUB_WORKSPACE/deepseek-harness"
      - name: Rebuild and authenticate unpatched DSH runtime
        if: always()
        working-directory: deepseek-harness
        run: |
          pnpm run clean
          pnpm run build:native-system
          pnpm run build:lib:host
          pnpm dsh --help >/dev/null
          node "$GITHUB_WORKSPACE/dsh-runtime-kit/dist/scripts/digest-dsh-build-closure.js" \
            "$GITHUB_WORKSPACE/deepseek-harness" \
            > "$RUNNER_TEMP/restored-dsh-build-closure.json"
          cmp "$RUNNER_TEMP/pristine-dsh-build-closure.json" \
            "$RUNNER_TEMP/restored-dsh-build-closure.json"
      # The alpha.6 patch awaits the now-asynchronous tools finish boundary.
      # Pristine alpha.6 cannot execute this tools canary, so first authenticate
      # its clean reversal above, then exercise the retained known-good release
      # as the executable rollback on every alpha.6 channel row.
      - name: Stage retained DSH 0.1.5 rollback runtime
        if: success() && matrix.dsh_version == '0.1.6-alpha.2'
        working-directory: deepseek-harness
        run: |
          git checkout --detach b2e3b2a0125854567a4a5fcba75782e42fe84901
          test "$(git rev-parse HEAD)" = b2e3b2a0125854567a4a5fcba75782e42fe84901
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run clean
          pnpm run build:lib:host
          pnpm dsh --help >/dev/null
      - name: Run retained unpatched DSH tools smoke
        if: success()
        working-directory: dsh-runtime-kit
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/deepseek-harness
          AGENT_HOOK_BIN: ${{ runner.temp }}/nils-cli-v1.28.43-x86_64-unknown-linux-gnu/bin/agent-hook
        run: |
          rollback_version="${{ matrix.dsh_version }}"
          rollback_revision="${{ matrix.revision }}"
          if [ "$rollback_version" = 0.1.6-alpha.2 ]; then
            rollback_version=0.1.5-alpha.2
            rollback_revision=b2e3b2a0125854567a4a5fcba75782e42fe84901
          fi
          package_name="$(npm pack --silent --ignore-scripts --pack-destination "$RUNNER_TEMP")"
          package="$RUNNER_TEMP/$package_name"
          package_sha="$(sha256sum "$package" | cut -d ' ' -f 1)"
          DSH_ACCEPTANCE_CANDIDATE_PACKAGE_TARBALL="$package" \
          DSH_ACCEPTANCE_BASELINE_PACKAGE_TARBALL="$package" \
          DSH_ACCEPTANCE_CANDIDATE_PACKAGE_SHA256="$package_sha" \
          DSH_ACCEPTANCE_BASELINE_PACKAGE_SHA256="$package_sha" \
          DSH_ACCEPTANCE_BASELINE_NILS_BIN_DIR="$RUNNER_TEMP/nils-cli-v1.28.43-x86_64-unknown-linux-gnu/bin" \
          DSH_ACCEPTANCE_CANDIDATE_NILS_SOURCE_COMMIT=98c6e50f18954cad0555c5f4fe63843891a71c6d \
          DSH_ACCEPTANCE_BASELINE_NILS_SOURCE_COMMIT=98c6e50f18954cad0555c5f4fe63843891a71c6d \
          DSH_ACCEPTANCE_CANDIDATE_NILS_ARTIFACTS='{"agent-hook":"e58815183eddb77b697f4ac92e438862432794f4a5b465396e47c186e6dc7d16","agent-docs":"5ee102e6c29d9db9af6a17eb3c6d72d1bfcb944a312c6a73186406b21c52d990"}' \
          DSH_ACCEPTANCE_BASELINE_NILS_ARTIFACTS='{"agent-hook":"e58815183eddb77b697f4ac92e438862432794f4a5b465396e47c186e6dc7d16","agent-docs":"5ee102e6c29d9db9af6a17eb3c6d72d1bfcb944a312c6a73186406b21c52d990"}' \
          DSH_ACCEPTANCE_DSH_VERSION="$rollback_version" \
          DSH_ACCEPTANCE_DSH_REVISION="$rollback_revision" \
          PNPM_BIN="$(command -v pnpm)" \
          NPM_BIN="$(command -v npm)" \
          DSH_ACCEPTANCE_UNPATCHED_ONLY=1 \
          npm run test:authoritative-acceptance-smoke
      - name: Assert upstream checkout returned to pristine state
        if: always()
        working-directory: deepseek-harness
        run: |
          observed_revision="$(git rev-parse HEAD)"
          if [ "${{ matrix.dsh_version }}" = 0.1.6-alpha.2 ]; then
            test "$observed_revision" = "${{ matrix.revision }}" \
              || test "$observed_revision" = b2e3b2a0125854567a4a5fcba75782e42fe84901
          else
            test "$observed_revision" = "${{ matrix.revision }}"
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  macos-runtime-health:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dsh-runtime-kit
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ddefc45fbc7f8e46dd73185e68295696d1297887
          path: deepseek-harness
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: deepseek-harness/pnpm-lock.yaml
      - name: Install runtime-kit dependencies and emit its build output
        working-directory: dsh-runtime-kit
        run: |
          npm ci --ignore-scripts --omit=peer
          npm run build:emit
          npm run build:provenance
      - name: Build pristine DSH on macOS
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run clean
          pnpm run build:native-system
          pnpm run build:lib:host
          node "$GITHUB_WORKSPACE/dsh-runtime-kit/dist/scripts/digest-dsh-build-closure.js" \
            "$GITHUB_WORKSPACE/deepseek-harness" \
            > "$RUNNER_TEMP/pristine-dsh-build-closure.json"
      - name: Link the vendored DSH cordis into the consumer
        working-directory: dsh-runtime-kit
        run: |
          mkdir -p node_modules/@deepseek-ai
          ln -s "$GITHUB_WORKSPACE/deepseek-harness/vendor/cordis" \
            node_modules/@deepseek-ai/cordis
      - name: Apply authenticated DSH execution-boundary patch
        working-directory: dsh-runtime-kit
        run: >-
          npm run --silent dsh-patch --
          --action apply
          --source-root "$GITHUB_WORKSPACE/deepseek-harness"
      - name: Validate Darwin descriptor binding and patched DSH boundary
        run: |
          cd dsh-runtime-kit
          node --test test/runtime-health-provider.test.ts
          cd ../deepseek-harness
          pnpm vitest run \
            packages/boot/app-boot/tests/app-boot.spec.ts \
            packages/core/tools/tests/tools.spec.ts \
            packages/fs/fs-sandbox/tests/fs-sandbox.spec.ts \
            packages/fs/tool-fs/tests/tools.spec.ts \
            packages/goal/goal/tests/goal.spec.ts \
            packages/llm/llm/tests/service.spec.ts \
            packages/sandbox/sandbox-local/tests/local.spec.ts \
            packages/sandbox/sandbox-policy/tests/policy.spec.ts \
            packages/sandbox/sandbox/tests/escalation.spec.ts \
            packages/shell/tool-bash/tests/tools.spec.ts \
            packages/subagent/subagent/tests/continuation.spec.ts \
            packages/subprocess/subprocess-local/tests/spawn.spec.ts
          pnpm run build:lib:host
      - name: Download authenticated macOS nils-cli acceptance binaries
        run: |
          archive="$RUNNER_TEMP/nils-cli-v1.28.43-aarch64-apple-darwin.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/sympoies/nils-cli/releases/download/v1.28.43/nils-cli-v1.28.43-aarch64-apple-darwin.tar.gz"
          echo "477364c691c233a9d263b05df749651afb143d618069b1a2aa5b567624b505e8  $archive" \
            | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
      - name: Run packed runtime-health smoke on macOS
        working-directory: dsh-runtime-kit
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/deepseek-harness
          AGENT_HOOK_BIN: ${{ runner.temp }}/nils-cli-v1.28.43-aarch64-apple-darwin/bin/agent-hook
          AGENT_DOCS_BIN: ${{ runner.temp }}/nils-cli-v1.28.43-aarch64-apple-darwin/bin/agent-docs
          DSH_RUNTIME_KIT_SMOKE_HEALTH_ONLY: '1'
        run: npm run test:smoke
      - name: Reverse authenticated DSH patch
        if: always()
        working-directory: dsh-runtime-kit
        run: >-
          npm run --silent dsh-patch --
          --action reverse
          --source-root "$GITHUB_WORKSPACE/deepseek-harness"
      - name: Rebuild and authenticate unpatched DSH runtime
        if: always()
        working-directory: deepseek-harness
        run: |
          pnpm run clean
          pnpm run build:native-system
          pnpm run build:lib:host
          pnpm dsh --help >/dev/null
          node "$GITHUB_WORKSPACE/dsh-runtime-kit/dist/scripts/digest-dsh-build-closure.js" \
            "$GITHUB_WORKSPACE/deepseek-harness" \
            > "$RUNNER_TEMP/restored-dsh-build-closure.json"
          cmp "$RUNNER_TEMP/pristine-dsh-build-closure.json" \
            "$RUNNER_TEMP/restored-dsh-build-closure.json"
      # The alpha.6 patch awaits the now-asynchronous tools finish boundary.
      # Pristine alpha.6 cannot execute this tools canary, so rollback evidence
      # must exercise the retained known-good release rather than pretending
      # that source reversal alone is an executable rollback.
      - name: Stage retained DSH 0.1.5 rollback runtime
        if: success()
        working-directory: deepseek-harness
        run: |
          git checkout --detach b2e3b2a0125854567a4a5fcba75782e42fe84901
          test "$(git rev-parse HEAD)" = b2e3b2a0125854567a4a5fcba75782e42fe84901
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run clean
          pnpm run build:lib:host
          pnpm dsh --help >/dev/null
      - name: Run retained unpatched DSH tools smoke
        if: success()
        working-directory: dsh-runtime-kit
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/deepseek-harness
          AGENT_HOOK_BIN: ${{ runner.temp }}/nils-cli-v1.28.43-aarch64-apple-darwin/bin/agent-hook
        run: |
          package_name="$(npm pack --silent --ignore-scripts --pack-destination "$RUNNER_TEMP")"
          package="$RUNNER_TEMP/$package_name"
          package_sha="$(shasum -a 256 "$package" | cut -d ' ' -f 1)"
          DSH_ACCEPTANCE_CANDIDATE_PACKAGE_TARBALL="$package" \
          DSH_ACCEPTANCE_BASELINE_PACKAGE_TARBALL="$package" \
          DSH_ACCEPTANCE_CANDIDATE_PACKAGE_SHA256="$package_sha" \
          DSH_ACCEPTANCE_BASELINE_PACKAGE_SHA256="$package_sha" \
          DSH_ACCEPTANCE_BASELINE_NILS_BIN_DIR="$RUNNER_TEMP/nils-cli-v1.28.43-aarch64-apple-darwin/bin" \
          DSH_ACCEPTANCE_CANDIDATE_NILS_SOURCE_COMMIT=98c6e50f18954cad0555c5f4fe63843891a71c6d \
          DSH_ACCEPTANCE_BASELINE_NILS_SOURCE_COMMIT=98c6e50f18954cad0555c5f4fe63843891a71c6d \
          DSH_ACCEPTANCE_CANDIDATE_NILS_ARTIFACTS='{"agent-hook":"b32f8325530eedd7cf36f472589d172e6eeeb32e4be468863e73d9756de2f01c","agent-docs":"5bb36217404098f404d09eb350a57c9dae608430c0240380ed8b17f455246cbd"}' \
          DSH_ACCEPTANCE_BASELINE_NILS_ARTIFACTS='{"agent-hook":"b32f8325530eedd7cf36f472589d172e6eeeb32e4be468863e73d9756de2f01c","agent-docs":"5bb36217404098f404d09eb350a57c9dae608430c0240380ed8b17f455246cbd"}' \
          DSH_ACCEPTANCE_DSH_VERSION=0.1.5-alpha.2 \
          DSH_ACCEPTANCE_DSH_REVISION=b2e3b2a0125854567a4a5fcba75782e42fe84901 \
          PNPM_BIN="$(command -v pnpm)" \
          NPM_BIN="$(command -v npm)" \
          DSH_ACCEPTANCE_UNPATCHED_ONLY=1 \
          npm run test:authoritative-acceptance-smoke
