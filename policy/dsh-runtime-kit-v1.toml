schema_version = "agent-hook.policy.v1"
bundle_id = "dsh-runtime-kit"
version = "2026.09.06.1"

# Tasks 3.2 through 3.4 port admission-critical mutation gates, bounded native
# lifecycle reminders, metadata-only activity, and authenticated operation
# leases into typed nils capabilities. DSH consumes allow/block for tool
# admission and native context at accepted lifecycle boundaries.
#
# Every rule carries the enforcement tier accepted on issue #197 (child #199)
# and frozen by nils `DshCapabilityGroup::tier()`: `integrity` rules are
# locked and always block; `governed-seam` rules block by default and are
# `downgrade-only`, so a receipt-bound `--policy-overrides` file may project
# them to `advise`; `reminder` rules are locked and only ever emit context.
# The `# tier:` line above each rule is checked by test/policy-parity.test.mjs.

[[rules]]
# tier: integrity
id = "dsh.owner-unclaimed"
products = ["dsh"]
events = ["PreToolUse"]
matcher = "bash|write|edit|str_replace_editor|runtime_kit_governed_commit"
priority = 100
mode = "enforce"
failure_posture = "closed"
override_class = "locked"
capability = { id = "dsh.policy.v1", group = "owner-unclaimed" }

