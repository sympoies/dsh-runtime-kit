# Repository catalog for agents contributing to this checkout. Root document
# entries route Codex, Claude, and Hermes; their project-scoped paths resolve
# from the repository root.
#
# DSH document routing is owned separately by agent-docs/AGENT_DOCS.toml, which
# is packaged and activated as DSH's home-scoped catalog. DSH remains included
# in the repository validation declared below. Do not add DSH to root document
# entries unless packaged document ownership is being replaced; otherwise DSH
# would receive duplicate model context.

[[document]]
context = "project-dev"
scope = "project"
path = "PROJECT_DEV_EDIT.md"
product = ["codex", "claude", "hermes"]
phase = "edit"
required = true
when = "always"
notes = "Runtime-neutral required edit contract for contributors; DSH loads its separate packaged home-scoped contract instead."

[[document]]
context = "project-dev"
scope = "project"
path = "DEVELOPMENT.md"
product = ["codex", "claude", "hermes"]
phase = ["edit", "delivery"]
required = false
when = "always"
notes = "Optional contributor orientation for setup, source ownership, validation, and delivery details."

[[document]]
context = "project-dev"
scope = "project"
path = "docs/policies/upstream-contribution.md"
product = ["codex", "claude", "hermes"]
phase = "delivery"
required = false
when = "always"
notes = "Optional delivery-phase reference; AGENTS.md makes it mandatory when cross-repository work is proposed."

[[validation]]
context = "project-dev"
product = ["codex", "claude", "hermes", "dsh"]
commands = ["npm test", "npm run typecheck", "npm run benchmark:policy"]
description = "Run the complete routine repository gate once for the final candidate."

# Project-owned classification consumed by phase-aware test-first and
# finish-line checks. Unmatched paths stay fail-closed.
[path_classes]
production = ["AGENT_DOCS.toml", "package.json", "package-lock.json", "index.js", "policy.js", "cordis.patch.yml", "bin/**", "src/**", "scripts/**", "policy/**", "compatibility/**", "patches/**", "agent-docs/**", "agents/**", "skills/**"]
test = ["test/**"]
docs = ["AGENTS.md", "CLAUDE.md", "PROJECT_DEV_EDIT.md", "README.md", "DEVELOPMENT.md", "LICENSE", "docs/**"]
unmatched = "unknown"
